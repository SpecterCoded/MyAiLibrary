name: Windows signed release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      PYTHONUTF8: "1"
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Require signing credentials
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw "Signed releases require WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD repository secrets."
          }

      - name: Validate tag, committed version, and release documentation
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -ne "tag") { throw "Stable releases must run from a pushed tag." }
          $version = "${{ github.ref_name }}".Substring(1)
          ./desktop/scripts/validate-release.ps1 -Version $version -Channel stable
          $releaseNotes = (Resolve-Path "desktop/release-notes/$version.md" -ErrorAction Stop).Path
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_FILE=$releaseNotes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
          python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Run release test gates
        shell: pwsh
        run: |
          npm --prefix frontend run validate:firebase-config
          npm --prefix frontend run validate:firebase-live
          npm --prefix frontend run test:release
          npm --prefix desktop test
          Push-Location backend
          try {
            python -m unittest test_auth_persistence test_chat_stream_reliability test_generation_logging test_processing_progress test_rag_pipeline_logging
            if ($LASTEXITCODE -ne 0) { throw "Backend unit tests failed." }
            python test_phase4.py
            if ($LASTEXITCODE -ne 0) { throw "RAG evaluation self-test failed." }
          } finally {
            Pop-Location
          }

      - name: Enable only the signed stable channel
        shell: pwsh
        run: |
          npm --prefix desktop pkg set updatesEnabled=true --json
          npm --prefix desktop pkg set updatesTestMode=false --json
          npm --prefix desktop pkg set updatesTestingEnabled=false --json

      - name: Prepare pinned FFmpeg
        shell: pwsh
        run: ./desktop/scripts/fetch-ffmpeg.ps1

      - name: Build application resources
        shell: pwsh
        run: npm --prefix desktop run build

      - name: Package signed NSIS update
        shell: pwsh
        run: |
          Push-Location desktop
          try {
            & .\node_modules\.bin\electron-builder.cmd --win nsis --x64 --publish never --config.releaseInfo.releaseNotesFile="$env:RELEASE_NOTES_FILE"
            if ($LASTEXITCODE -ne 0) { throw "Electron Builder failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }

      - name: Smoke test packaged Electron startup and secure session storage
        shell: pwsh
        run: ./desktop/scripts/smoke-packaged-app.ps1 -ExecutablePath ./desktop/release/win-unpacked/MyAILibrary.exe

      - name: Verify Authenticode and generate checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/release/MyAI-Library-Setup-*-x64.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          $blockMap = "$($installer.FullName).blockmap"
          if (-not (Test-Path -LiteralPath $blockMap)) { throw "Installer block map is missing: $blockMap" }
          if (-not (Test-Path -LiteralPath desktop/release/stable.yml)) { throw "Stable update metadata is missing." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.Status)" }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content desktop/release/SHA256SUMS.txt -Encoding ascii

      - name: Publish verified stable release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "My AI Library $($tag.TrimStart('v'))" --notes-file "$env:RELEASE_NOTES_FILE" --latest
          } else {
            gh release create $tag --title "My AI Library $($tag.TrimStart('v'))" --notes-file "$env:RELEASE_NOTES_FILE" --latest --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to create or update GitHub release $tag." }
          gh release upload $tag desktop/release/MyAI-Library-Setup-*-x64.exe desktop/release/MyAI-Library-Setup-*-x64.exe.blockmap desktop/release/stable.yml desktop/release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload one or more release assets for $tag." }

      - name: Retain release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-library-windows-${{ github.ref_name }}
          path: |
            desktop/release/MyAI-Library-Setup-*-x64.exe
            desktop/release/*.blockmap
            desktop/release/stable.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
