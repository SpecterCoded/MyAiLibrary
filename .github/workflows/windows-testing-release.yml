name: Windows unsigned beta release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      EP_PRE_RELEASE: "true"
      PYTHONUTF8: "1"
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Validate tag, committed version, and release documentation
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -ne "tag") { throw "Beta releases must run from a pushed tag." }
          $version = "${{ github.ref_name }}".Substring(1)
          ./desktop/scripts/validate-release.ps1 -Version $version -Channel beta
          $releaseNotes = (Resolve-Path "desktop/release-notes/$version.md" -ErrorAction Stop).Path
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_FILE=$releaseNotes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
          python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - name: Run release test gates
        shell: pwsh
        run: |
          npm --prefix frontend run validate:firebase-config
          npm --prefix frontend run validate:firebase-live
          npm --prefix frontend run test:release
          npm --prefix frontend run build
          npm --prefix desktop test
          Push-Location backend
          try {
            python -m unittest test_auth_persistence test_firebase_auth test_workspace_storage test_workspace_deletion test_chat_stream_reliability test_generation_logging test_processing_progress test_rag_pipeline_logging
            if ($LASTEXITCODE -ne 0) { throw "Backend unit tests failed." }
            python test_phase4.py
            if ($LASTEXITCODE -ne 0) { throw "RAG evaluation self-test failed." }
          } finally {
            Pop-Location
          }

      - name: Enable only the unsigned beta channel
        shell: pwsh
        run: |
          npm --prefix desktop pkg set updatesEnabled=false --json
          npm --prefix desktop pkg set updatesTestMode=false --json
          npm --prefix desktop pkg set updatesTestingEnabled=true --json

      - name: Prepare pinned FFmpeg
        shell: pwsh
        run: ./desktop/scripts/fetch-ffmpeg.ps1

      - name: Build application resources
        shell: pwsh
        run: npm --prefix desktop run build

      - name: Package unsigned beta NSIS update
        shell: pwsh
        run: |
          Push-Location desktop
          try {
            & .\node_modules\.bin\electron-builder.cmd --win nsis --x64 --publish never --config.win.verifyUpdateCodeSignature=false --config.publish.channel=beta --config.publish.releaseType=prerelease --config.releaseInfo.releaseNotesFile="$env:RELEASE_NOTES_FILE"
            if ($LASTEXITCODE -ne 0) { throw "Electron Builder failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }

      - name: Smoke test packaged Electron authentication and secure session storage
        shell: pwsh
        run: ./desktop/scripts/smoke-packaged-app.ps1 -ExecutablePath ./desktop/release/win-unpacked/MyAILibrary.exe

      - name: Verify package and generate checksum
        shell: pwsh
        run: |
          $expectedName = "MyAI-Library-Setup-$env:RELEASE_VERSION-x64.exe"
          $installers = @(Get-ChildItem desktop/release/MyAI-Library-Setup-*-x64.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Name -ne $expectedName) { throw "Unexpected installer name: $($installer.Name)" }
          $blockMap = "$($installer.FullName).blockmap"
          if (-not (Test-Path -LiteralPath $blockMap)) { throw "Installer block map is missing: $blockMap" }
          if (-not (Test-Path -LiteralPath desktop/release/beta.yml)) { throw "Beta update metadata is missing." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -notin @("NotSigned", "UnknownError")) {
            throw "Unsigned beta unexpectedly reported Authenticode status $($signature.Status)."
          }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content desktop/release/SHA256SUMS.txt -Encoding ascii

      - name: Stage verified beta prerelease as a draft
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $versionParts = $env:RELEASE_VERSION -split "-beta\."
          $releaseTitle = "My AI Library v$($versionParts[0]) Beta $($versionParts[1])"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $releaseTitle --notes-file "$env:RELEASE_NOTES_FILE" --prerelease --draft
          } else {
            gh release create $tag --title $releaseTitle --notes-file "$env:RELEASE_NOTES_FILE" --prerelease --draft --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage GitHub prerelease $tag." }
          gh release upload $tag desktop/release/MyAI-Library-Setup-*-x64.exe desktop/release/MyAI-Library-Setup-*-x64.exe.blockmap desktop/release/beta.yml desktop/release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload one or more release assets for $tag." }

      - name: Verify staged prerelease metadata and assets
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $release = gh release view $tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to read staged prerelease $tag." }
          if ($release.tagName -ne $tag -or -not $release.isDraft -or -not $release.isPrerelease) {
            throw "Staged release metadata is not the expected draft prerelease."
          }
          $expectedAssets = @(
            "MyAI-Library-Setup-$env:RELEASE_VERSION-x64.exe",
            "MyAI-Library-Setup-$env:RELEASE_VERSION-x64.exe.blockmap",
            "beta.yml",
            "SHA256SUMS.txt"
          )
          $publishedAssets = @($release.assets | ForEach-Object { $_.name })
          foreach ($asset in $expectedAssets) {
            if ($asset -notin $publishedAssets) { throw "Staged prerelease is missing $asset." }
          }

      - name: Publish validated beta prerelease
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release edit $tag --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish validated prerelease $tag." }
          $release = gh release view $tag --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if (
            $LASTEXITCODE -ne 0 -or
            $release.tagName -ne $tag -or
            $release.isDraft -or
            -not $release.isPrerelease
          ) {
            throw "Published release metadata is not the expected public prerelease."
          }

      - name: Retain beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-library-windows-${{ env.RELEASE_VERSION }}
          path: |
            desktop/release/MyAI-Library-Setup-*-x64.exe
            desktop/release/*.blockmap
            desktop/release/beta.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
