<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting MyAiLibrary</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        color-scheme: light dark;
        --splash-text: #111827;
        --splash-muted: #64748b;
        --splash-bg: radial-gradient(circle at 50% 12%, #ffffff 0, #eef2ff 48%, #f8fafc 100%);
        --splash-track: #e2e8f0;
        --splash-shadow: rgba(79, 70, 229, .18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-text: #f8fafc;
          --splash-muted: #94a3b8;
          --splash-bg: radial-gradient(circle at 50% 15%, #1e293b 0, #090b10 62%);
          --splash-track: #1e293b;
          --splash-shadow: rgba(37, 99, 235, .26);
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        color: var(--splash-text);
        background: var(--splash-bg);
        font-family: "Segoe UI", sans-serif;
        user-select: none;
      }
      main { text-align: center; }
      img {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 18px 30px var(--splash-shadow));
      }
      h1 {
        margin: 18px 0 7px;
        font-size: 24px;
        letter-spacing: -.4px;
      }
      p {
        margin: 0;
        color: var(--splash-muted);
        font-size: 13px;
      }
      .loader {
        width: 180px;
        height: 3px;
        margin: 28px auto 0;
        overflow: hidden;
        border-radius: 9px;
        background: var(--splash-track);
      }
      .loader::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #2563eb, #4f46e5);
        animation: loading 1.2s ease-in-out infinite;
      }
      @keyframes loading {
        from { transform: translateX(-110%); }
        to { transform: translateX(330%); }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo-mark-blue.png" alt="MyAiLibrary" draggable="false" />
      <h1>MyAiLibrary</h1>
      <p>Starting your local knowledge workspace…</p>
      <div class="loader"></div>
    </main>
  </body>
</html>
